            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.08);

            top: 0;
            left: 0;

            height: 100%;
            z-index: 0;
            pointer-events: auto;
        }

            position: relative;
            z-index: 10;

        }
        .contact-row {
            display: flex;
            flex-wrap: wrap;

            margin-top: 0.5rem;
        }
        .contact-chip {

    <script type="module">
        import * as THREE from 'three';

        // --- 3D 粒子系统配置 (保持原有效果) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = null;
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;
        camera.position.y = 2;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        
        const PARTICLE_COUNT = 1800;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const velocities = [];
        
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const radius = 18;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.sin(phi) * Math.sin(theta) * 0.8;
            const z = radius * Math.cos(phi);
            positions[i*3] = x + (Math.random() - 0.5) * 6;
            positions[i*3+1] = y + (Math.random() - 0.5) * 5;
            positions[i*3+2] = z + (Math.random() - 0.5) * 8;
            
            velocities.push({
                x: (Math.random() - 0.5) * 0.02,
                y: (Math.random() - 0.5) * 0.02,
                z: (Math.random() - 0.5) * 0.02
            });
            
            const color = new THREE.Color().setHSL(0.55 + Math.random() * 0.2, 0.8, 0.6);
            colors[i*3] = color.r;
            colors[i*3+1] = color.g;
            colors[i*3+2] = color.b;
        }
        
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        
        const particleMaterial = new THREE.PointsMaterial({
            size: 0.28,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.9
        });
        
        const particleSystem = new THREE.Points(geometry, particleMaterial);
        scene.add(particleSystem);
        
        const starCount = 800;
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for (let i = 0; i < starCount; i++) {
            starPos.push((Math.random() - 0.5) * 70);
            starPos.push((Math.random() - 0.5) * 40);
            starPos.push((Math.random() - 0.5) * 50 - 20);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
        const starMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.12, transparent: true, blending: THREE.AdditiveBlending });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);
        
        let time = 0;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;
        let currentRotationX = 0, currentRotationY = 0;
        
        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = (event.clientY / window.innerHeight) * 2 - 1;
            targetRotationY = mouseX * 0.5;
            targetRotationX = mouseY * 0.3;
        });
        
        window.addEventListener('touchmove', (event) => {
            if (event.touches.length) {
                mouseX = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouseY = (event.touches[0].clientY / window.innerHeight) * 2 - 1;
                targetRotationY = mouseX * 0.5;
                targetRotationX = mouseY * 0.3;
            }
        });
        
        function randomizeParticles() {
            const positionsAttr = geometry.attributes.position.array;
            const colorsAttr = geometry.attributes.color.array;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (Math.random() > 0.6) {
                    const radius = 18;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    positionsAttr[i*3] = radius * Math.sin(phi) * Math.cos(theta) + (Math.random() - 0.5) * 5;
                    positionsAttr[i*3+1] = radius * Math.sin(phi) * Math.sin(theta) * 0.8 + (Math.random() - 0.5) * 4;
                    positionsAttr[i*3+2] = radius * Math.cos(phi) + (Math.random() - 0.5) * 7;
                } else {
                    positionsAttr[i*3] += (Math.random() - 0.5) * 1.2;
                    positionsAttr[i*3+1] += (Math.random() - 0.5) * 1.0;
                    positionsAttr[i*3+2] += (Math.random() - 0.5) * 1.2;
                    if (Math.abs(positionsAttr[i*3]) > 32) positionsAttr[i*3] *= 0.9;
                    if (Math.abs(positionsAttr[i*3+1]) > 28) positionsAttr[i*3+1] *= 0.9;
                    if (Math.abs(positionsAttr[i*3+2]) > 35) positionsAttr[i*3+2] *= 0.9;
                }
                const hue = 0.5 + Math.random() * 0.4;
                const sat = 0.7 + Math.random() * 0.3;
                const lit = 0.6 + Math.random() * 0.4;
                const col = new THREE.Color().setHSL(hue, sat, lit);
                colorsAttr[i*3] = col.r;
                colorsAttr[i*3+1] = col.g;
                colorsAttr[i*3+2] = col.b;
                
                velocities[i] = {
                    x: (Math.random() - 0.5) * 0.025,
                    y: (Math.random() - 0.5) * 0.025,
                    z: (Math.random() - 0.5) * 0.025
                };
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;
            
            const starPosAttr = starField.geometry.attributes.position.array;
            for (let i = 0; i < starCount; i++) {
                if (Math.random() > 0.7) {
                    starPosAttr[i*3] += (Math.random() - 0.5) * 1.5;
                    starPosAttr[i*3+1] += (Math.random() - 0.5) * 1.2;
                    starPosAttr[i*3+2] += (Math.random() - 0.5) * 1.5;
                    if (Math.abs(starPosAttr[i*3]) > 55) starPosAttr[i*3] *= 0.95;
                    if (Math.abs(starPosAttr[i*3+1]) > 40) starPosAttr[i*3+1] *= 0.95;
                    if (Math.abs(starPosAttr[i*3+2]) > 45) starPosAttr[i*3+2] *= 0.95;
                }
            }
            starField.geometry.attributes.position.needsUpdate = true;
        }
        
        window.addEventListener('click', () => randomizeParticles());
        window.addEventListener('touchstart', () => randomizeParticles());
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;
            
            const positionsAttr = geometry.attributes.position.array;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positionsAttr[i*3] += velocities[i].x;
                positionsAttr[i*3+1] += velocities[i].y;
                positionsAttr[i*3+2] += velocities[i].z;
                if (Math.abs(positionsAttr[i*3]) > 32) velocities[i].x *= -0.98;
                if (Math.abs(positionsAttr[i*3+1]) > 28) velocities[i].y *= -0.98;
                if (Math.abs(positionsAttr[i*3+2]) > 35) velocities[i].z *= -0.98;
            }
            geometry.attributes.position.needsUpdate = true;
            
            starField.rotation.y += 0.0005;
            starField.rotation.x += 0.0003;
            
            currentRotationX += (targetRotationX - currentRotationX) * 0.08;
            currentRotationY += (targetRotationY - currentRotationY) * 0.08;
            particleSystem.rotation.x = currentRotationX * 0.5;
            particleSystem.rotation.y = currentRotationY * 0.8;
            
            camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.03;
            camera.position.y += (-mouseY * 0.3 - camera.position.y) * 0.03;
            camera.lookAt(0, 0, 0);
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                return m;
            });
        }

        function initInteractions() {
            const themeBtn = document.getElementById("themeToggle");
            const printBtn = document.getElementById("printBtn");
            const backBtn = document.getElementById("back2top");
            const stored = localStorage.getItem("theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (stored === "dark" || (!stored && prefersDark)) document.body.classList.add("dark");
            themeBtn?.addEventListener("click", () => { document.body.classList.toggle("dark"); localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light"); });
            printBtn?.addEventListener("click", () => window.print());
            backBtn?.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
            document.querySelectorAll('.nav-links a').forEach(anchor => { anchor.addEventListener('click', function(e) { const href = this.getAttribute('href'); if(href?.startsWith('#')) { e.preventDefault(); document.querySelector(href)?.scrollIntoView({ behavior: 'smooth' }); } }); });
        }
        window.addEventListener('DOMContentLoaded', () => { renderApp(); initInteractions(); });
